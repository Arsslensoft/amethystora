name: Stable Images
on:
  merge_group: # Make Stable-Daily run on merge groups
  pull_request:
    branches:
      - main
      - testing
    paths-ignore:
      - "**.md"
      - ".github/workflows/*validate*.yml"
      - "system_files/shared/etc/bazaar/**"
  schedule:
    - cron: "0 1 * * TUE" # Every Tuesday at 1:00 AM UTC
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  # A run that publishes (reusable-build.yml's PUBLISH, the same condition) holds a token that can write packages,
  # attest and sign in. Every other run (a pull request, a dispatch from another branch) is build-image-stable-unpublished,
  # below, with read access alone: a called workflow may only lower its caller's token, so two jobs are how a pull
  # request gets less
  build-image-stable:
    name: Build Stable Images
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event.merge_group.base_ref == 'refs/heads/main') }}
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        brand_name: ["amethystora"]
    with:
      # Pin stable to a kernel if needed, like for ZFS compatibility
      # kernel_pin: 7.0.12-201.fc44.x86_64
      brand_name: ${{ matrix.brand_name }}
      stream_name: stable

  build-image-stable-unpublished:
    name: Build Stable Images
    if: ${{ !(github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event.merge_group.base_ref == 'refs/heads/main')) }}
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        brand_name: ["amethystora"]
    with:
      # Pin stable to a kernel if needed, like for ZFS compatibility
      # kernel_pin: 7.0.12-201.fc44.x86_64
      brand_name: ${{ matrix.brand_name }}
      stream_name: stable

  build-iso:
    name: Build ISO
    needs: [build-image-stable]
    if: contains(fromJson('["schedule", "workflow_dispatch"]'), github.event_name)
    permissions:
      contents: read
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        image: ["amethystora", "amethystora-dx", "amethystora-nvidia-open", "amethystora-dx-nvidia-open", "amethystora-nvidia-lts", "amethystora-dx-nvidia-lts"]
    uses: ./.github/workflows/build-iso.yml
    with:
      image: ${{ matrix.image }}

  generate-release:
    name: Generate Release
    needs: [build-image-stable, build-image-stable-unpublished]
    # Whichever of the two builds ran, and it passed
    if: ${{ !cancelled() && contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/generate-release.yml
    with:
      stream_name: '["stable", "stable-daily"]'
