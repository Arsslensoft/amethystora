name: Compare build layouts
# Temporary, for plans/PLAN-build-layers.md's equivalence test: builds the same image the old way (origin/main) and
# the new way (this branch) on one runner, the same hour, and lists every file, package and initramfs entry that
# differs. Publishes nothing and holds no secret.
on:
  push:
    branches: [build-layers]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: compare (${{ matrix.image }}, ${{ matrix.flavor }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: amethystora, flavor: main }
          - { image: amethystora-dx, flavor: main }
          - { image: amethystora, flavor: nvidia-open }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master

      - name: Install Just
        uses: ./.github/actions/install-just

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          install-dir: /usr/local/bin
          use-sudo: true

      - name: Compare
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/compare"
          mkdir -p "${out}"
          name="${IMAGE}"
          [[ "${FLAVOR}" == main ]] || name="${IMAGE}-${FLAVOR}"
          dump() {
            local image="$1" to="$2" mnt
            mnt="$(sudo podman image mount "${image}")"
            sudo find "${mnt}" -xdev -mindepth 1 -printf '%P\t%y\t%m\t%U:%G\t%l\n' | LC_ALL=C sort >"${to}.list"
            sudo sh -c 'cd "$1" && find . -xdev -type f -print0 | xargs -0 -r sha256sum' sh "${mnt}" | LC_ALL=C sort -k2 >"${to}.sha"
            sudo podman image umount "${image}"
            sudo podman run --rm "${image}" rpm -qa --queryformat '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | LC_ALL=C sort >"${to}.rpms"
            sudo podman run --rm "${image}" sh -c 'lsinitrd /usr/lib/modules/*/initramfs.img' |
              awk '$1 ~ /^[-dlcbps][-rwxsStT]{9}/ { print $1, $5, $NF }' | LC_ALL=C sort -k3 >"${to}.initrd"
            sudo podman run --rm "${image}" sh -c 'systemctl list-unit-files --no-legend --no-pager' | LC_ALL=C sort >"${to}.units"
          }
          # The new layout first, so that a failure in it shows at once
          start="${SECONDS}"
          sudo "$(command -v just)" build "${IMAGE}" latest "${FLAVOR}"
          echo "::notice::the new layout built in $(((SECONDS - start) / 60)) min"
          dump "localhost/${name}:latest" "${out}/new"
          sudo podman rmi -a -f >/dev/null
          sudo podman system prune -a -f >/dev/null
          start="${SECONDS}"
          git worktree add -q "${RUNNER_TEMP}/old" origin/main
          (cd "${RUNNER_TEMP}/old" && sudo "$(command -v just)" build "${IMAGE}" latest "${FLAVOR}")
          echo "::notice::the old layout built in $(((SECONDS - start) / 60)) min"
          dump "localhost/${name}:latest" "${out}/old"
          for kind in list sha rpms initrd units; do
            diff "${out}/old.${kind}" "${out}/new.${kind}" >"${out}/diff.${kind}" || true
            echo "${kind}: $(grep -c '^[<>]' "${out}/diff.${kind}" || true) lines differ"
          done | tee -a "${GITHUB_STEP_SUMMARY}"
          for kind in rpms units initrd list sha; do
            { echo; echo "### ${kind}"; echo '```'; head -n 400 "${out}/diff.${kind}"; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
          done

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compare-${{ matrix.image }}-${{ matrix.flavor }}
          path: ${{ runner.temp }}/compare
          retention-days: 7
