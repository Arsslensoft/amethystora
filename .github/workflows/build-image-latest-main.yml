name: Latest Images
on:
  merge_group:
  pull_request:
    branches:
      - main
      - testing
    paths-ignore:
      - ".github/workflows/*validate*.yml"
      - "**.md"
      - "flatpaks/**"
      - "system_files/shared/etc/bazaar/**"
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  # A run that publishes (reusable-build.yml's PUBLISH, the same condition) holds a token that can write packages,
  # attest and sign in. Every other run (a pull request, a dispatch from another branch) is build-image-latest-unpublished,
  # below, with read access alone: a called workflow may only lower its caller's token, so two jobs are how a pull
  # request gets less
  build-image-latest:
    name: Build Latest Images
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event.merge_group.base_ref == 'refs/heads/main') }}
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        brand_name: ["amethystora"]
    with:
      image_flavors: '["main", "nvidia-open", "nvidia-lts"]'
      brand_name: ${{ matrix.brand_name }}
      stream_name: latest

  build-image-latest-unpublished:
    name: Build Latest Images
    if: ${{ !(github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event.merge_group.base_ref == 'refs/heads/main')) }}
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        brand_name: ["amethystora"]
    with:
      image_flavors: '["main", "nvidia-open", "nvidia-lts"]'
      brand_name: ${{ matrix.brand_name }}
      stream_name: latest

  generate-release:
    name: Generate Release
    needs: [build-image-latest, build-image-latest-unpublished]
    # Whichever of the two builds ran, and it passed
    if: ${{ !cancelled() && contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/generate-release.yml
    with:
      stream_name: '["latest"]'
