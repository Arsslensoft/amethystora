<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* Glass: the wallpaper's shapes drift under the top bar and the dock, which show it blurred and tinted */
.art { --loop: 3.6s; --poster: 0.3; }
@keyframes drift { 0% { transform: translateX(0); } 50% { transform: translateX(-46px); } 100% { transform: translateX(0); } }
@keyframes drift2 { 0% { transform: translateX(0); } 50% { transform: translateX(40px); } 100% { transform: translateX(0); } }
.screen { position: absolute; left: 8px; top: 6px; width: 134px; height: 100px; border-radius: 8px; overflow: hidden; background: #1f1530; }
.blob { position: absolute; border-radius: 50%; }
.b1 { left: 64px; top: -14px; width: 46px; height: 46px; background: #b37df9; animation-name: drift; }
.b2 { left: 10px; top: 58px; width: 40px; height: 40px; background: #e8a85a; animation-name: drift2; }
.b3 { left: 84px; top: 64px; width: 30px; height: 30px; background: #6fd3e0; animation-name: drift; }
.glass { position: absolute; box-sizing: border-box; background: rgba(43, 33, 64, 0.35); border: 1px solid rgba(255, 255, 255, 0.28); -webkit-backdrop-filter: blur(7px) saturate(1.3); backdrop-filter: blur(7px) saturate(1.3); }
.bar { left: 5px; right: 5px; top: 5px; height: 14px; border-radius: 7px; }
.dock { left: 30px; top: 70px; width: 74px; height: 22px; border-radius: 9px; display: flex; gap: 5px; align-items: center; justify-content: center; }
.dock .sq { width: 12px; height: 12px; background: rgba(239, 228, 255, 0.7); }
.menu { left: 64px; top: 24px; width: 62px; height: 38px; border-radius: 8px; }
.menu .line { left: 8px; }
</style>
</head>
<body>
<div class="art">
  <div class="screen">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
    <i class="glass bar"></i>
    <div class="glass menu"><i class="line" style="top: 9px; width: 40px"></i><i class="line" style="top: 17px; width: 30px"></i><i class="line" style="top: 25px; width: 44px"></i></div>
    <div class="glass dock"><i class="sq"></i><i class="sq"></i><i class="sq"></i><i class="sq"></i></div>
  </div>
</div>
</body>
</html>
