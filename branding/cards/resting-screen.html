<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* A resting screen: left alone, the windows go and a large clock rests over the drifting wallpaper; the pointer moves and everything comes back */
.art { --loop: 3.6s; --poster: 0.55; }
@keyframes drift { 0%, 20% { background-position: 0% 0%; } 50% { background-position: 60% 30%; } 80%, 100% { background-position: 0% 0%; } }
@keyframes away { 0%, 14% { opacity: 1; } 26%, 76% { opacity: 0; } 86%, 100% { opacity: 1; } }
@keyframes rest { 0%, 20% { opacity: 0; transform: scale(0.94); } 32%, 74% { opacity: 1; transform: scale(1); } 82%, 100% { opacity: 0; transform: scale(0.94); } }
@keyframes hand { 0%, 66% { left: 112px; top: 90px; opacity: 0; } 70% { left: 112px; top: 90px; opacity: 1; } 80% { left: 96px; top: 74px; opacity: 1; } 92% { left: 96px; top: 74px; opacity: 1; } 100% { left: 112px; top: 90px; opacity: 0; } }
@keyframes min { from { transform: rotate(40deg); } to { transform: rotate(400deg); } }
.wall { position: absolute; left: 0; top: 0; width: 150px; height: 112px; background: linear-gradient(135deg, #4a2f78 0%, #1a1226 50%, #27406a 100%); background-size: 180% 180%; animation-name: drift; }
.desk { position: absolute; left: 0; top: 0; width: 150px; height: 112px; animation-name: away; }
.bar { position: absolute; left: 0; top: 0; width: 150px; height: 14px; background: rgba(26, 18, 38, 0.7); }
.w1 { left: 10px; top: 22px; width: 76px; height: 80px; }
.w2 { left: 92px; top: 22px; width: 48px; height: 80px; }
.rest { position: absolute; left: 0; top: 0; width: 150px; height: 112px; animation-name: rest; }
.face { position: absolute; left: 51px; top: 22px; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #efe4ff; box-sizing: border-box; }
.hh { position: absolute; left: 20px; top: 10px; width: 3px; height: 13px; border-radius: 2px; background: #efe4ff; transform: rotate(-60deg); transform-origin: 50% 100%; }
.mm { position: absolute; left: 20px; top: 5px; width: 2px; height: 18px; border-radius: 1px; background: #b37df9; transform-origin: 50% 100%; animation-name: min; animation-timing-function: linear; }
.date { left: 55px; top: 80px; width: 40px; background: rgba(239, 228, 255, 0.6); }
.pointer { position: absolute; width: 14px; height: 18px; animation-name: hand; }
</style>
</head>
<body>
<div class="art">
  <div class="wall"></div>
  <div class="desk"><div class="bar"></div><i class="win w1"></i><i class="win w2"></i></div>
  <div class="rest"><div class="face"><i class="hh"></i><i class="mm"></i></div><i class="line date"></i></div>
  <svg class="pointer" viewBox="0 0 24 30"><path d="M4 3L20 16 12.6 17.3 8.7 24Z" fill="#ffffff" stroke="#9148f0" stroke-width="2" stroke-linejoin="round"/></svg>
</div>
</body>
</html>
