<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* Streams: three tracks of builds, the weekly one sparse and the others dense; the machine follows one and switches to another */
.art { --loop: 3.4s; --poster: 0.42; }
@keyframes ride {
  0% { left: 4px; top: 52px; opacity: 0; }
  6% { left: 12px; top: 52px; opacity: 1; }
  34% { left: 54px; top: 52px; }
  50% { left: 78px; top: 28px; }
  86% { left: 128px; top: 28px; opacity: 1; }
  92%, 100% { left: 136px; top: 28px; opacity: 0; }
}
.track { position: absolute; left: 6px; width: 138px; height: 3px; border-radius: 2px; background: rgba(239, 228, 255, 0.18); }
.b { position: absolute; top: -3px; width: 4px; height: 9px; border-radius: 2px; }
.s .b { background: #8ddba4; }
.l .b { background: #b37df9; }
.x .b { background: #e8c06a; }
.ride { position: absolute; width: 14px; height: 14px; margin: -5px 0 0 -7px; border-radius: 50%; background: #efe4ff; animation-name: ride; }
</style>
</head>
<body>
<div class="art">
  <div class="track l" style="top: 28px"><i class="b" style="left: 10px"></i><i class="b" style="left: 30px"></i><i class="b" style="left: 46px"></i><i class="b" style="left: 70px"></i><i class="b" style="left: 88px"></i><i class="b" style="left: 104px"></i><i class="b" style="left: 126px"></i></div>
  <div class="track s" style="top: 54px"><i class="b" style="left: 20px"></i><i class="b" style="left: 66px"></i><i class="b" style="left: 112px"></i></div>
  <div class="track x" style="top: 80px"><i class="b" style="left: 14px"></i><i class="b" style="left: 38px"></i><i class="b" style="left: 60px"></i><i class="b" style="left: 84px"></i><i class="b" style="left: 98px"></i><i class="b" style="left: 120px"></i></div>
  <i class="ride"></i>
</div>
</body>
</html>
