<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* A routine: the computer joins a known Wi-Fi network, and by itself it opens Files and mutes the sound */
.art { --loop: 3.6s; --poster: 0.62; }
@keyframes a1 { 0%, 8% { opacity: 0.15; } 14%, 88% { opacity: 1; } 96%, 100% { opacity: 0.15; } }
@keyframes a2 { 0%, 14% { opacity: 0.15; } 20%, 88% { opacity: 1; } 96%, 100% { opacity: 0.15; } }
@keyframes a3 { 0%, 20% { opacity: 0.15; } 26%, 88% { opacity: 1; } 96%, 100% { opacity: 0.15; } }
@keyframes open { 0%, 36% { opacity: 0; transform: scale(0.7); } 46%, 88% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
@keyframes waves { 0%, 50% { opacity: 1; } 56%, 92% { opacity: 0; } 100% { opacity: 1; } }
@keyframes slash { 0%, 52% { transform: scaleX(0); } 60%, 88% { transform: scaleX(1); } 96%, 100% { transform: scaleX(0); } }
@keyframes flow { 0%, 28% { opacity: 0; transform: translateX(-6px); } 34%, 88% { opacity: 1; transform: translateX(0); } 96%, 100% { opacity: 0; transform: translateX(0); } }
.wifi { position: absolute; left: 10px; top: 30px; width: 40px; height: 34px; }
.arc { position: absolute; left: 50%; border-radius: 50%; border: 3px solid transparent; border-top-color: #dcbcff; box-sizing: border-box; }
.r1 { width: 40px; height: 40px; margin-left: -20px; top: 0; animation-name: a3; }
.r2 { width: 28px; height: 28px; margin-left: -14px; top: 7px; animation-name: a2; }
.r3 { width: 6px; height: 6px; margin-left: -3px; top: 21px; border: none; background: #dcbcff; animation-name: a1; }
.arrow { position: absolute; left: 54px; top: 46px; width: 14px; height: 2px; background: rgba(239, 228, 255, 0.5); animation-name: flow; }
.arrow::after { content: ""; position: absolute; right: -2px; top: -3px; border: 4px solid transparent; border-left-color: rgba(239, 228, 255, 0.5); border-right: 0; }
.files { left: 76px; top: 14px; width: 64px; height: 44px; animation-name: open; }
.folder { position: absolute; left: 10px; top: 14px; width: 18px; height: 13px; border-radius: 2px; background: #b37df9; }
.folder::before { content: ""; position: absolute; left: 0; top: -3px; width: 8px; height: 4px; border-radius: 2px 2px 0 0; background: #b37df9; }
.f2 { left: 34px; }
.spk { position: absolute; left: 86px; top: 70px; width: 40px; height: 26px; }
.body { position: absolute; left: 4px; top: 8px; width: 7px; height: 10px; background: #dcbcff; border-radius: 2px; }
.cone { position: absolute; left: 8px; top: 3px; border: 10px solid transparent; border-right: 10px solid #dcbcff; border-left: 0; }
.sw { position: absolute; top: 3px; border-radius: 50%; border: 2px solid transparent; border-right-color: #dcbcff; box-sizing: border-box; animation-name: waves; }
.slash { position: absolute; left: 1px; top: 0; width: 34px; height: 3px; border-radius: 2px; background: #f08a8a; transform-origin: left center; rotate: 38deg; animation-name: slash; }
</style>
</head>
<body>
<div class="art">
  <div class="wifi"><i class="arc r1"></i><i class="arc r2"></i><i class="arc r3"></i></div>
  <i class="arrow"></i>
  <div class="win files"><i class="folder"></i><i class="folder f2"></i></div>
  <div class="spk"><i class="body"></i><i class="cone"></i><i class="sw" style="left: 16px; width: 12px; height: 20px"></i><i class="sw" style="left: 18px; width: 18px; height: 20px; top: 3px"></i><i class="slash"></i></div>
</div>
</body>
</html>
