<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* Workspaces by number: Super and 3 slide to the third workspace, Super and 1 back to the first */
.art { --loop: 3.4s; --poster: 0.32; }
@keyframes ksuper { 0%, 8% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } 12%, 40% { transform: translateY(2px); background: #b37df9; } 44%, 56% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } 60%, 88% { transform: translateY(2px); background: #b37df9; } 92%, 100% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } }
@keyframes k3 { 0%, 16% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } 20%, 26% { transform: translateY(2px); background: #b37df9; } 30%, 100% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } }
@keyframes k1 { 0%, 62% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } 66%, 72% { transform: translateY(2px); background: #b37df9; } 76%, 100% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } }
@keyframes on { 0%, 22% { left: 6px; } 38%, 68% { left: 26px; } 84%, 100% { left: 6px; } }
@keyframes out { 0%, 22% { transform: translateX(0); } 38%, 68% { transform: translateX(-134px); } 84%, 100% { transform: translateX(0); } }
@keyframes in { 0%, 22% { transform: translateX(134px); } 38%, 68% { transform: translateX(0); } 84%, 100% { transform: translateX(134px); } }
.screen { left: 8px; top: 4px; width: 134px; height: 74px; background: rgba(255, 255, 255, 0.05); overflow: hidden; }
.bar { position: absolute; left: 0; right: 0; top: 0; height: 11px; background: rgba(0, 0, 0, 0.3); }
.ws { position: absolute; top: 4px; width: 7px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.3); }
.cur { position: absolute; top: 3px; width: 7px; height: 6px; border-radius: 2px; background: #b37df9; animation-name: on; }
.page { position: absolute; left: 0; top: 11px; width: 132px; height: 62px; }
.p1 { animation-name: out; }
.p3 { animation-name: in; }
.ks { left: 26px; top: 84px; animation-name: ksuper; }
.k1 { left: 82px; top: 84px; width: 24px; padding: 0; animation-name: k1; }
.k3 { left: 110px; top: 84px; width: 24px; padding: 0; animation-name: k3; }
</style>
</head>
<body>
<div class="art">
  <div class="pane screen">
    <div class="page p1"><i class="win" style="left: 8px; top: 6px; width: 116px; height: 52px"></i></div>
    <div class="page p3"><i class="win" style="left: 8px; top: 6px; width: 56px; height: 52px"></i><i class="win" style="left: 68px; top: 6px; width: 56px; height: 52px; border-color: rgba(179, 125, 249, 0.6)"></i></div>
    <div class="bar"><i class="ws" style="left: 6px"></i><i class="ws" style="left: 16px"></i><i class="ws" style="left: 26px"></i><i class="ws" style="left: 36px"></i><i class="ws" style="left: 46px"></i><i class="ws" style="left: 56px"></i><i class="cur"></i></div>
  </div>
  <span class="cap ks">Super</span><span class="cap k1">1</span><span class="cap k3">3</span>
</div>
</body>
</html>
