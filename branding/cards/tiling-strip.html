<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* The tiling strip: Super and Right scroll the strip to the next window, which the frame marks; Super and Left come back */
.art { --loop: 3.2s; --poster: 0.3; }
@keyframes ksuper { 0%, 8% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } 14%, 40% { transform: translateY(2px); background: #b37df9; } 46%, 54% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } 60%, 88% { transform: translateY(2px); background: #b37df9; } 94%, 100% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } }
@keyframes kr { 0%, 16% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } 20%, 34% { transform: translateY(2px); background: #b37df9; } 38%, 100% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } }
@keyframes kl { 0%, 58% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } 62%, 68% { transform: translateY(2px); background: #b37df9; } 72%, 100% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } }
@keyframes scroll { 0%, 24% { left: -10px; } 46%, 68% { left: -64px; } 90%, 100% { left: -10px; } }
@keyframes frame { 0%, 22% { left: 42px; width: 54px; } 28%, 66% { left: 96px; width: 48px; } 72%, 100% { left: 42px; width: 54px; } }
.screen { left: 30px; top: 6px; width: 90px; height: 66px; background: transparent; border: 1px solid rgba(220, 188, 255, 0.55); }
.strip { position: absolute; top: 12px; height: 54px; width: 182px; animation-name: scroll; }
.strip .win { top: 0; height: 54px; }
.frame { position: absolute; top: -2px; height: 58px; border: 2px solid #b37df9; border-radius: 8px; box-sizing: border-box; animation-name: frame; }
.mask { position: absolute; top: 0; height: 80px; background: rgba(26, 18, 38, 0.72); }
.ks { left: 22px; top: 82px; animation-name: ksuper; }
.kl { left: 84px; top: 82px; animation-name: kl; }
.kr { left: 112px; top: 82px; animation-name: kr; }
.tri { width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 6px solid #efe4ff; }
.tri.l { border-left: 0; border-right: 6px solid #efe4ff; }
.ar { width: 24px; padding: 0; }
</style>
</head>
<body>
<div class="art">
  <div class="strip">
    <i class="win" style="left: 0; width: 40px"></i><i class="win" style="left: 44px; width: 50px"></i><i class="win" style="left: 98px; width: 44px"></i><i class="win" style="left: 146px; width: 36px"></i>
    <i class="frame"></i>
  </div>
  <i class="mask" style="left: 0; width: 30px"></i><i class="mask" style="left: 120px; width: 30px"></i>
  <div class="pane screen"></div>
  <span class="cap ks">Super</span><span class="cap ar kl"><i class="tri l"></i></span><span class="cap ar kr"><i class="tri"></i></span>
</div>
</body>
</html>
