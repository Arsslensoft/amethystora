<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* Told when a command ends: a long command runs in a terminal behind another window; it ends, a notice says so, and a click brings it to the front */
.art { --loop: 3.4s; --poster: 0.6; }
@keyframes bar { 0%, 4% { width: 0; } 46%, 98% { width: 30px; } 100% { width: 0; } }
@keyframes shown { 0%, 94% { opacity: 1; } 98% { opacity: 0; } 100% { opacity: 1; } }
@keyframes note { 0%, 48% { transform: translateY(-34px); opacity: 0; } 56%, 74% { transform: translateY(0); opacity: 1; } 80%, 100% { transform: translateY(0); opacity: 0; } }
@keyframes front { 0%, 74% { z-index: 1; transform: translate(0, 0); } 76%, 94% { z-index: 3; transform: translate(26px, -14px); } 100% { z-index: 1; transform: translate(0, 0); } }
@keyframes press { 0%, 68% { transform: scale(1); } 71% { transform: scale(0.95); } 74%, 100% { transform: scale(1); } }
@keyframes ok { 0%, 46% { opacity: 0; } 50%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes hand { 0%, 54% { left: 132px; top: 100px; opacity: 0; } 58% { opacity: 1; } 66%, 74% { left: 116px; top: 22px; opacity: 1; } 80%, 100% { left: 116px; top: 22px; opacity: 0; } }
.term { left: 8px; top: 40px; width: 82px; height: 62px; background: #120c1b; animation-name: front; }
.term .p { position: absolute; left: 7px; height: 3px; border-radius: 2px; background: rgba(239, 228, 255, 0.4); }
.term .prog { position: absolute; left: 7px; top: 38px; width: 30px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; animation-name: shown; }
.term .fillbar { position: absolute; left: 0; top: 0; height: 5px; background: #b37df9; animation-name: bar; animation-timing-function: linear; }
.term .done { position: absolute; left: 38px; top: 36px; width: 9px; height: 9px; border-radius: 50%; background: #8ddba4; animation-name: ok; }
.other { left: 56px; top: 30px; width: 86px; height: 76px; z-index: 2; }
.note { left: 58px; top: 6px; width: 84px; height: 24px; z-index: 4; display: flex; align-items: center; gap: 6px; padding-left: 6px; background: #3d3150; animation-name: note, press; }
.note .line { position: static; width: 44px; }
.ic { width: 12px; height: 12px; border-radius: 4px; background: #120c1b; border: 1.5px solid #b37df9; box-sizing: border-box; }
.pointer { position: absolute; width: 14px; height: 18px; z-index: 5; animation-name: hand; }
</style>
</head>
<body>
<div class="art">
  <div class="win term"><i class="p" style="top: 13px; width: 28px"></i><i class="p" style="top: 21px; width: 34px"></i><i class="p" style="top: 29px; width: 20px"></i><span class="prog"><i class="fillbar"></i></span><i class="done"></i></div>
  <div class="win other"></div>
  <div class="pane note"><i class="ic"></i><i class="line"></i></div>
  <svg class="pointer" viewBox="0 0 24 30"><path d="M4 3L20 16 12.6 17.3 8.7 24Z" fill="#ffffff" stroke="#9148f0" stroke-width="2" stroke-linejoin="round"/></svg>
</div>
</body>
</html>
