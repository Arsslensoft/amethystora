<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* Copying text from the screen: an area framed over text, Ctrl and E, and the words go to the clipboard */
.art { --loop: 3.4s; --poster: 0.4; }
@keyframes kctrl { 0%, 26% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } 30%, 40% { transform: translateY(2px); background: #b37df9; } 44%, 100% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } }
@keyframes ke { 0%, 30% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } 34%, 38% { transform: translateY(2px); background: #b37df9; } 42%, 100% { transform: translateY(0); background: rgba(255, 255, 255, 0.14); } }
@keyframes sel { 0%, 6% { width: 0; height: 0; opacity: 1; } 20%, 46% { width: 74px; height: 32px; opacity: 1; } 52%, 100% { width: 74px; height: 32px; opacity: 0; } }
@keyframes hi { 0%, 32% { background: rgba(239, 228, 255, 0.35); } 38%, 86% { background: #b37df9; } 94%, 100% { background: rgba(239, 228, 255, 0.35); } }
@keyframes fly { 0%, 48% { left: 25px; top: 32px; opacity: 0; transform: scale(1); } 52% { left: 25px; top: 32px; opacity: 1; transform: scale(1); } 66% { left: 114px; top: 80px; opacity: 1; transform: scale(0.3); } 70%, 100% { left: 114px; top: 80px; opacity: 0; transform: scale(0.3); } }
@keyframes board { 0%, 64% { transform: scale(1); } 69% { transform: scale(1.2); } 76%, 100% { transform: scale(1); } }
.w { left: 10px; top: 8px; width: 96px; height: 64px; }
.w .line { left: 14px; }
.t { animation-name: hi; }
.sel { position: absolute; left: 20px; top: 26px; border: 1.5px dashed #efe4ff; border-radius: 3px; box-sizing: border-box; animation-name: sel; }
.copy { position: absolute; width: 60px; height: 20px; transform-origin: 0 0; animation-name: fly; }
.copy .line { left: 0; background: #b37df9; }
.board { position: absolute; left: 118px; top: 74px; width: 18px; height: 24px; border: 2px solid #dcbcff; border-radius: 3px; box-sizing: border-box; animation-name: board; }
.board::before { content: ""; position: absolute; left: 3px; top: -4px; width: 8px; height: 5px; border-radius: 2px; background: #dcbcff; }
.board .line { left: 3px; width: 8px; height: 2px; }
.ks { left: 14px; top: 84px; animation-name: kctrl; }
.ke { left: 56px; top: 84px; width: 24px; padding: 0; animation-name: ke; }
</style>
</head>
<body>
<div class="art">
  <div class="win w">
    <i class="line t" style="top: 23px; width: 58px"></i><i class="line t" style="top: 32px; width: 46px"></i><i class="line t" style="top: 41px; width: 52px"></i>
    <i class="line" style="top: 54px; width: 30px; background: rgba(239, 228, 255, 0.15)"></i>
  </div>
  <i class="sel"></i>
  <div class="copy"><i class="line" style="top: 0; width: 58px"></i><i class="line" style="top: 9px; width: 46px"></i><i class="line" style="top: 18px; width: 52px"></i></div>
  <div class="board"><i class="line" style="top: 6px"></i><i class="line" style="top: 11px"></i><i class="line" style="top: 16px"></i></div>
  <span class="cap ks">Ctrl</span><span class="cap ke">E</span>
</div>
</body>
</html>
