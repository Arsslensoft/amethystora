<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* A timer you can feel: the ring drains round the pill itself, and the end comes with a glow */
.art { --loop: 3.4s; --poster: 0.35; }
.bar { position: absolute; left: 0; top: 34px; width: 150px; height: 40px; background: rgba(255, 255, 255, 0.06); }
@keyframes drain { 0% { stroke-dashoffset: 0; opacity: 1; } 70% { stroke-dashoffset: 100; opacity: 1; } 88% { stroke-dashoffset: 100; opacity: 0; } 89% { stroke-dashoffset: 0; opacity: 0; } 100% { stroke-dashoffset: 0; opacity: 1; } }
@keyframes glow { 0%, 68% { box-shadow: 0 0 0 rgba(179, 125, 249, 0); background: #3b2a5c; } 76%, 82% { box-shadow: 0 0 16px 4px rgba(179, 125, 249, 0.75); background: #6a46a8; } 94%, 100% { box-shadow: 0 0 0 rgba(179, 125, 249, 0); background: #3b2a5c; } }
@keyframes bar { 0% { width: 40px; } 70%, 88% { width: 0; } 100% { width: 40px; } }
.pill { position: absolute; left: 30px; top: 40px; width: 90px; height: 28px; border-radius: 14px; animation-name: glow; }
.ring { position: absolute; left: 27px; top: 37px; width: 96px; height: 34px; overflow: visible; }
.ring rect { animation-name: drain; animation-duration: var(--loop); animation-iteration-count: infinite; animation-timing-function: linear; animation-fill-mode: both; }
.icon { position: absolute; left: 10px; top: 8px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #dcbcff; box-sizing: border-box; }
.icon::after { content: ""; position: absolute; left: 3px; top: 1px; width: 2px; height: 4px; background: #dcbcff; border-radius: 1px; }
.left { position: absolute; left: 32px; top: 12px; height: 4px; border-radius: 2px; background: #efe4ff; animation-name: bar; animation-timing-function: linear; }
</style>
</head>
<body>
<div class="art">
  <div class="bar"></div>
  <div class="pill"><i class="icon"></i><i class="left"></i></div>
  <svg class="ring" viewBox="0 0 96 34"><rect x="1.5" y="1.5" width="93" height="31" rx="15.5" fill="none" stroke="#b37df9" stroke-width="3" pathLength="100" stroke-dasharray="100"/></svg>
</div>
</body>
</html>
