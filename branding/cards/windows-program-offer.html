<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* Windows programs: the program is scanned, then the same app for Linux is offered first, before the bottle */
.art { --loop: 3.4s; --poster: 0.7; }
@keyframes sweep { 0%, 6% { top: 12px; opacity: 0; } 9% { opacity: 1; } 28% { top: 44px; opacity: 1; } 31%, 100% { top: 44px; opacity: 0; } }
@keyframes ok { 0%, 30% { opacity: 0; transform: scale(0.4); } 36%, 90% { opacity: 1; transform: scale(1); } 98%, 100% { opacity: 0; transform: scale(1); } }
@keyframes r1 { 0%, 38% { opacity: 0; transform: translateX(8px); } 46%, 90% { opacity: 1; transform: translateX(0); } 98%, 100% { opacity: 0; transform: translateX(0); } }
@keyframes r2 { 0%, 46% { opacity: 0; transform: translateX(8px); } 54%, 90% { opacity: 0.55; transform: translateX(0); } 98%, 100% { opacity: 0; transform: translateX(0); } }
@keyframes pick { 0%, 62% { box-shadow: 0 0 0 0 rgba(179, 125, 249, 0); background: rgba(255, 255, 255, 0.12); } 68%, 90% { box-shadow: 0 0 0 2px #b37df9; background: rgba(179, 125, 249, 0.3); } 98%, 100% { box-shadow: 0 0 0 0 rgba(179, 125, 249, 0); background: rgba(255, 255, 255, 0.12); } }
@keyframes hand { 0%, 50% { left: 128px; top: 96px; opacity: 0; } 54% { opacity: 1; } 64%, 80% { left: 116px; top: 40px; opacity: 1; } 88%, 100% { left: 116px; top: 40px; opacity: 0; } }
.file { position: absolute; left: 10px; top: 14px; width: 30px; height: 38px; border-radius: 3px 10px 3px 3px; background: #c9c2d6; overflow: hidden; }
.gear { position: absolute; left: 7px; top: 12px; width: 16px; height: 16px; border-radius: 50%; border: 4px dotted #3d3150; box-sizing: border-box; }
.scan { position: absolute; left: 6px; width: 38px; height: 3px; border-radius: 2px; background: #8ddba4; box-shadow: 0 0 6px #8ddba4; animation-name: sweep; }
.ok { position: absolute; left: 30px; top: 44px; width: 16px; height: 16px; border-radius: 50%; background: #8ddba4; animation-name: ok; }
.ok::after { content: ""; position: absolute; left: 5px; top: 3px; width: 4px; height: 7px; border: solid #1a1226; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.row { left: 54px; width: 88px; height: 28px; display: flex; align-items: center; gap: 6px; padding-left: 7px; }
.row .line { position: static; width: 44px; }
.appic { width: 16px; height: 16px; border-radius: 5px; background: linear-gradient(135deg, #6fd3e0, #9148f0); }
.bottle { position: relative; width: 10px; height: 16px; margin: 0 3px; border-radius: 3px 3px 4px 4px; background: #8ddba4; }
.bottle::before { content: ""; position: absolute; left: 3px; top: -4px; width: 4px; height: 5px; border-radius: 1px; background: #8ddba4; }
.pointer { position: absolute; width: 14px; height: 18px; animation-name: hand; }
</style>
</head>
<body>
<div class="art">
  <div class="file"><i class="gear"></i></div>
  <i class="scan"></i>
  <i class="ok"></i>
  <div class="pane row" style="top: 26px; animation-name: r1, pick"><i class="appic"></i><i class="line"></i></div>
  <div class="pane row" style="top: 62px; animation-name: r2"><i class="bottle"></i><i class="line" style="width: 36px"></i></div>
  <svg class="pointer" viewBox="0 0 24 30"><path d="M4 3L20 16 12.6 17.3 8.7 24Z" fill="#ffffff" stroke="#9148f0" stroke-width="2" stroke-linejoin="round"/></svg>
</div>
</body>
</html>
