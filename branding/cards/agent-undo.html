<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* The agent's change in the pill: the agent turns a switch on, the pill says so, and Undo in its card turns it back */
.art { --loop: 3.6s; --poster: 0.5; }
@keyframes sw { 0%, 14% { background: rgba(255, 255, 255, 0.18); } 20%, 66% { background: #b37df9; } 72%, 100% { background: rgba(255, 255, 255, 0.18); } }
@keyframes knob { 0%, 14% { transform: translateX(0); } 20%, 66% { transform: translateX(10px); } 72%, 100% { transform: translateX(0); } }
@keyframes pill { 0%, 16% { width: 16px; } 24%, 78% { width: 46px; } 86%, 100% { width: 16px; } }
@keyframes mark { 0%, 16% { opacity: 0; } 22% { opacity: 1; } 34% { opacity: 0.5; } 46% { opacity: 1; } 58% { opacity: 0.5; } 70% { opacity: 1; } 80%, 100% { opacity: 0; } }
@keyframes card { 0%, 30% { opacity: 0; transform: translateY(-5px); } 38%, 74% { opacity: 1; transform: translateY(0); } 82%, 100% { opacity: 0; transform: translateY(0); } }
@keyframes press { 0%, 58% { background: rgba(255, 255, 255, 0.14); } 62%, 66% { background: #b37df9; } 72%, 100% { background: rgba(255, 255, 255, 0.14); } }
@keyframes hand { 0%, 40% { transform: translate(20px, 30px); opacity: 0; } 48% { opacity: 1; } 58%, 66% { transform: translate(0, 0); opacity: 1; } 76%, 100% { transform: translate(0, 0); opacity: 0; } }
.screen { position: absolute; left: 8px; top: 6px; width: 134px; height: 100px; border-radius: 8px; overflow: hidden; background: linear-gradient(135deg, #3a2560, #1f1530); }
.top { position: absolute; left: 4px; right: 4px; top: 4px; height: 14px; border-radius: 7px; background: rgba(255, 255, 255, 0.1); }
.pill { position: absolute; left: 50%; top: 2px; height: 10px; transform: translateX(-50%); border-radius: 5px; background: #120c1c; overflow: hidden; animation-name: pill; }
.spark { position: absolute; left: 4px; top: 2.5px; width: 5px; height: 5px; border-radius: 50%; background: #dcbcff; box-shadow: 0 0 4px #b37df9; animation-name: mark; }
.pill .l { position: absolute; left: 13px; top: 3.5px; width: 26px; height: 3px; border-radius: 2px; background: rgba(239, 228, 255, 0.5); }
.card { left: 34px; top: 22px; width: 66px; height: 26px; background: #2b2140; animation-name: card; }
.card .line { left: 7px; top: 11px; width: 30px; }
.undo { position: absolute; left: 44px; top: 6px; width: 16px; height: 14px; border-radius: 5px; animation-name: press; }
.undo::before { content: ""; position: absolute; left: 4px; top: 3px; width: 7px; height: 7px; border: 1.5px solid #efe4ff; border-left-color: transparent; border-radius: 50%; box-sizing: border-box; }
.undo::after { content: ""; position: absolute; left: 3px; top: 3px; border: 3px solid transparent; border-top-color: #efe4ff; }
.setting { position: absolute; left: 22px; top: 58px; width: 90px; height: 32px; border-radius: 7px; background: #2b2140; border: 1px solid rgba(255, 255, 255, 0.16); }
.setting .line { left: 9px; top: 14px; width: 40px; }
.sw { position: absolute; left: 62px; top: 10px; width: 20px; height: 11px; border-radius: 6px; animation-name: sw; }
.knob { position: absolute; left: 1.5px; top: 1.5px; width: 8px; height: 8px; border-radius: 50%; background: #efe4ff; animation-name: knob; }
.pointer { position: absolute; left: 86px; top: 36px; width: 12px; height: 15px; animation-name: hand; }
</style>
</head>
<body>
<div class="art">
  <div class="screen">
    <div class="top"><div class="pill"><i class="spark"></i><i class="l"></i></div></div>
    <div class="setting"><i class="line"></i><i class="sw"><i class="knob"></i></i></div>
    <div class="pane card"><i class="line"></i><i class="undo"></i></div>
    <svg class="pointer" viewBox="0 0 24 30"><path d="M4 3L20 16 12.6 17.3 8.7 24Z" fill="#ffffff" stroke="#9148f0" stroke-width="2" stroke-linejoin="round"/></svg>
  </div>
</div>
</body>
</html>
