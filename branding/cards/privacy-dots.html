<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* Privacy dots: the microphone (amber), the camera (green) and the screen (red) light their dots in turn; sharing the screen adds the red glow round its edges */
.art { --loop: 3.4s; --poster: 0.66; }
.bar { position: absolute; left: 0; top: 0; width: 150px; height: 24px; background: rgba(255, 255, 255, 0.07); }
@keyframes pill { 0%, 4% { opacity: 0; } 10%, 84% { opacity: 1; } 92%, 100% { opacity: 0; } }
@keyframes a { 0%, 8% { opacity: 0; transform: scale(0.3); } 14%, 84% { opacity: 1; transform: scale(1); } 92%, 100% { opacity: 0; transform: scale(0.3); } }
@keyframes g { 0%, 28% { opacity: 0; transform: scale(0.3); } 34%, 84% { opacity: 1; transform: scale(1); } 92%, 100% { opacity: 0; transform: scale(0.3); } }
@keyframes r { 0%, 48% { opacity: 0; transform: scale(0.3); } 54%, 84% { opacity: 1; transform: scale(1); } 92%, 100% { opacity: 0; transform: scale(0.3); } }
@keyframes glow { 0%, 50% { opacity: 0; } 58%, 82% { opacity: 1; } 90%, 100% { opacity: 0; } }
.pill { position: absolute; left: 96px; top: 5px; width: 34px; height: 14px; border-radius: 7px; background: rgba(255, 255, 255, 0.16); animation-name: pill; }
.d { position: absolute; top: 9px; width: 7px; height: 7px; border-radius: 50%; }
.sys { position: absolute; left: 135px; top: 8px; width: 9px; height: 9px; border-radius: 3px; background: rgba(239, 228, 255, 0.5); }
.clock { left: 60px; top: 10px; width: 30px; background: #efe4ff; }
.glow { position: absolute; left: 0; top: 0; width: 150px; height: 112px; box-shadow: inset 0 0 10px 3px rgba(240, 96, 96, 0.85); animation-name: glow; }
.w1 { left: 14px; top: 34px; width: 122px; height: 70px; }
</style>
</head>
<body>
<div class="art">
  <div class="bar"></div>
  <i class="line clock"></i>
  <i class="win w1"></i>
  <i class="pill"></i>
  <i class="d" style="left: 101px; background: #e8c06a; animation-name: a"></i>
  <i class="d" style="left: 110px; background: #8ddba4; animation-name: g"></i>
  <i class="d" style="left: 119px; background: #f06060; animation-name: r"></i>
  <i class="sys"></i>
  <i class="glow"></i>
</div>
</body>
</html>
