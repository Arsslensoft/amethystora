<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* Send to anyone: three words appear on one computer, the same three on the other, and the file crosses, sealed */
.art { --loop: 3.4s; --poster: 0.55; }
@keyframes w1 { 0%, 8% { opacity: 0; transform: scale(0.5); } 14%, 88% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
@keyframes w2 { 0%, 14% { opacity: 0; transform: scale(0.5); } 20%, 88% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
@keyframes w3 { 0%, 20% { opacity: 0; transform: scale(0.5); } 26%, 88% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
@keyframes v1 { 0%, 32% { opacity: 0; transform: scale(0.5); } 37%, 88% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
@keyframes v2 { 0%, 36% { opacity: 0; transform: scale(0.5); } 41%, 88% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
@keyframes v3 { 0%, 40% { opacity: 0; transform: scale(0.5); } 45%, 88% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
@keyframes doc { 0%, 50% { transform: translate(0, 0); opacity: 0; } 54% { transform: translate(0, 0); opacity: 1; } 64% { transform: translate(44px, -14px); opacity: 1; } 76% { transform: translate(88px, 0); opacity: 1; } 88% { transform: translate(88px, 0); opacity: 1; } 96%, 100% { transform: translate(88px, 0); opacity: 0; } }
@keyframes trail { 0%, 54% { opacity: 0; } 60%, 74% { opacity: 1; } 80%, 100% { opacity: 0; } }
.mon { top: 12px; width: 50px; height: 42px; }
.stand { position: absolute; top: 54px; width: 14px; height: 8px; border-radius: 0 0 3px 3px; background: rgba(255, 255, 255, 0.18); }
.w { position: absolute; height: 8px; border-radius: 4px; background: #b37df9; }
.doc { position: absolute; left: 25px; top: 74px; width: 16px; height: 20px; border-radius: 2px 6px 2px 2px; background: #efe4ff; animation-name: doc; }
.doc::after { content: ""; position: absolute; left: 4px; top: 8px; width: 8px; height: 7px; border-radius: 2px; background: #9148f0; }
.trail { position: absolute; left: 40px; top: 66px; width: 72px; height: 22px; border-top: 2px dashed rgba(220, 188, 255, 0.45); border-radius: 50% 50% 0 0; animation-name: trail; }
</style>
</head>
<body>
<div class="art">
  <div class="pane mon" style="left: 8px"></div><div class="pane mon" style="left: 92px"></div>
  <i class="stand" style="left: 26px"></i><i class="stand" style="left: 110px"></i>
  <i class="w" style="left: 13px; top: 20px; width: 22px; animation-name: w1"></i>
  <i class="w" style="left: 13px; top: 31px; width: 30px; animation-name: w2"></i>
  <i class="w" style="left: 13px; top: 42px; width: 18px; animation-name: w3"></i>
  <i class="w" style="left: 97px; top: 20px; width: 22px; animation-name: v1"></i>
  <i class="w" style="left: 97px; top: 31px; width: 30px; animation-name: v2"></i>
  <i class="w" style="left: 97px; top: 42px; width: 18px; animation-name: v3"></i>
  <i class="trail"></i>
  <i class="doc"></i>
</div>
</body>
</html>
