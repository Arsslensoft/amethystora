<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* USB protection while locked: on the lock screen a USB stick goes in and is refused, a plain keyboard goes in and works */
.art { --loop: 3.4s; --poster: 0.3; }
@keyframes stick { 0%, 6% { transform: translateY(-26px); opacity: 0; } 14%, 40% { transform: translateY(0); opacity: 1; } 48%, 100% { transform: translateY(-26px); opacity: 0; } }
@keyframes no { 0%, 16% { opacity: 0; transform: scale(0.6); } 22%, 40% { opacity: 1; transform: scale(1); } 46%, 100% { opacity: 0; transform: scale(1); } }
@keyframes kb { 0%, 50% { transform: translateY(-30px); opacity: 0; } 60%, 88% { transform: translateY(0); opacity: 1; } 96%, 100% { transform: translateY(-30px); opacity: 0; } }
@keyframes yes { 0%, 62% { opacity: 0; transform: scale(0.6); } 68%, 88% { opacity: 1; transform: scale(1); } 94%, 100% { opacity: 0; transform: scale(1); } }
.screen { left: 6px; top: 6px; width: 138px; height: 68px; border-radius: 8px; background: #120c1c; }
.padlock { position: absolute; left: 64px; top: 18px; width: 22px; height: 28px; }
.body { position: absolute; left: 0; bottom: 0; width: 22px; height: 16px; border-radius: 4px; background: #b37df9; }
.loop { position: absolute; left: 4px; top: 0; width: 14px; height: 16px; border-radius: 7px 7px 0 0; border: 3px solid #b37df9; border-bottom: 0; box-sizing: border-box; }
.field { position: absolute; left: 49px; top: 52px; width: 52px; height: 10px; border-radius: 5px; background: rgba(255, 255, 255, 0.14); }
.port { position: absolute; left: 30px; top: 92px; width: 90px; height: 14px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); }
.slot { position: absolute; top: 96px; width: 18px; height: 6px; border-radius: 1px; background: #0c0814; }
.stick { position: absolute; left: 40px; top: 74px; width: 14px; height: 24px; animation-name: stick; }
.stick::before { content: ""; position: absolute; left: 0; top: 0; width: 14px; height: 16px; border-radius: 3px; background: #6fd3e0; }
.stick::after { content: ""; position: absolute; left: 3px; top: 16px; width: 8px; height: 6px; background: #c8c8d0; }
.kb { position: absolute; left: 82px; top: 72px; width: 36px; height: 26px; animation-name: kb; }
.kb::before { content: ""; position: absolute; left: 0; top: 0; width: 36px; height: 16px; border-radius: 3px; background: #dcbcff; background-image: radial-gradient(circle, #2b2140 1.2px, transparent 1.6px); background-size: 6px 5px; background-position: 1px 1px; }
.kb::after { content: ""; position: absolute; left: 14px; top: 16px; width: 8px; height: 8px; background: #c8c8d0; }
.mark { position: absolute; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.no { left: 26px; top: 66px; background: #ff6b6b; animation-name: no; }
.no::before, .no::after { content: ""; position: absolute; width: 10px; height: 2.5px; background: #1a1226; transform: rotate(45deg); }
.no::after { transform: rotate(-45deg); }
.yes { left: 120px; top: 66px; background: #8ddba4; animation-name: yes; }
.yes::before { content: ""; position: absolute; left: 5px; top: 4px; width: 5px; height: 8px; border: solid #1a1226; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
</style>
</head>
<body>
<div class="art">
  <div class="pane screen"></div>
  <div class="padlock"><i class="loop"></i><i class="body"></i></div>
  <i class="field"></i>
  <i class="port"></i><i class="slot" style="left: 38px"></i><i class="slot" style="left: 91px"></i>
  <i class="stick"></i><i class="kb"></i>
  <i class="mark no"></i><i class="mark yes"></i>
</div>
</body>
</html>
