<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* A pool of disks: both disks hold the same files; one dies, the files are still on the other; a new disk takes its place and is filled */
.art { --loop: 3.6s; --poster: 0.3; }
@keyframes die {
  0%, 18% { transform: translate(0, 0); opacity: 1; border-color: rgba(255, 255, 255, 0.16); }
  24%, 32% { transform: translate(0, 0); opacity: 1; border-color: #e86a7a; }
  42% { transform: translate(0, 18px); opacity: 0; border-color: #e86a7a; }
  52% { transform: translate(40px, 0); opacity: 0; border-color: rgba(255, 255, 255, 0.16); }
  60%, 100% { transform: translate(0, 0); opacity: 1; border-color: rgba(255, 255, 255, 0.16); }
}
@keyframes f1 { 0%, 38% { opacity: 1; } 42%, 64% { opacity: 0; } 68%, 100% { opacity: 1; } }
@keyframes f2 { 0%, 38% { opacity: 1; } 42%, 70% { opacity: 0; } 74%, 100% { opacity: 1; } }
@keyframes f3 { 0%, 38% { opacity: 1; } 42%, 76% { opacity: 0; } 80%, 100% { opacity: 1; } }
@keyframes led { 0%, 18% { background: #8ddba4; } 22%, 40% { background: #e86a7a; } 60%, 100% { background: #8ddba4; } }
@keyframes keep { 0%, 26% { box-shadow: none; } 34%, 52% { box-shadow: 0 0 0 2px rgba(141, 219, 164, 0.6); } 62%, 100% { box-shadow: none; } }
.disk { left: 22px; top: 14px; width: 46px; height: 82px; border-radius: 8px; }
.d2 { left: 82px; animation-name: die; }
.d1 { animation-name: keep; }
.disk::before { display: none; }
.led { position: absolute; left: 18px; bottom: 7px; width: 8px; height: 4px; border-radius: 2px; background: #8ddba4; }
.d2 .led { animation-name: led; }
.f { position: absolute; left: 10px; width: 26px; height: 12px; border-radius: 3px; }
.f.a { top: 10px; background: #9148f0; } .f.b { top: 26px; background: #6fd3e0; } .f.c { top: 42px; background: #e8c06a; }
.d2 .f.a { animation-name: f1; } .d2 .f.b { animation-name: f2; } .d2 .f.c { animation-name: f3; }
</style>
</head>
<body>
<div class="art">
  <div class="win disk d1"><i class="f a"></i><i class="f b"></i><i class="f c"></i><i class="led"></i></div>
  <div class="win disk d2"><i class="f a"></i><i class="f b"></i><i class="f c"></i><i class="led"></i></div>
</div>
</body>
</html>
