<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* Updates in the background: you keep working in a window while a download fills in the corner, then it says ready */
.art { --loop: 3.2s; --poster: 0.62; }
@keyframes fill { 0%, 8% { width: 0; } 55% { width: 44px; } 90% { width: 44px; opacity: 1; } 96%, 100% { width: 44px; opacity: 0; } }
@keyframes arrow { 0%, 6% { transform: translateY(-3px); opacity: 0.4; } 20% { transform: translateY(2px); opacity: 1; } 32% { transform: translateY(-3px); opacity: 0.4; } 44% { transform: translateY(2px); opacity: 1; } 56%, 100% { transform: translateY(-3px); opacity: 0; } }
@keyframes ready { 0%, 56% { opacity: 0; transform: scale(0.4); } 64%, 88% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
@keyframes type1 { 0%, 10% { width: 18px; } 45% { width: 60px; } 100% { width: 60px; } }
@keyframes type2 { 0%, 45% { width: 0; } 80%, 100% { width: 44px; } }
@keyframes caret { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
.work { left: 10px; top: 26px; width: 86px; height: 70px; }
.work .line { left: 9px; }
.l1 { top: 18px; width: 54px; }
.l2 { top: 28px; width: 40px; }
.l3 { top: 38px; animation-name: type1; animation-timing-function: linear; }
.l4 { top: 48px; animation-name: type2; animation-timing-function: linear; }
.tray { left: 92px; top: 8px; width: 52px; height: 32px; }
.arrow { position: absolute; left: 21px; top: 4px; width: 10px; height: 13px; animation-name: arrow; }
.arrow::before { content: ""; position: absolute; left: 3px; top: 0; width: 4px; height: 7px; background: #dcbcff; border-radius: 1px; }
.arrow::after { content: ""; position: absolute; left: 0; top: 7px; border: 5px solid transparent; border-top: 6px solid #dcbcff; border-bottom: 0; }
.bar { position: absolute; left: 4px; top: 21px; width: 44px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.15); overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; height: 5px; border-radius: 3px; background: #b37df9; animation-name: fill; animation-timing-function: linear; }
.ready { position: absolute; left: 18px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #8ddba4; animation-name: ready; }
.ready::after { content: ""; position: absolute; left: 4px; top: 3px; width: 6px; height: 3px; border-left: 2px solid #1a1226; border-bottom: 2px solid #1a1226; transform: rotate(-45deg); }
</style>
</head>
<body>
<div class="art">
  <div class="win work"><i class="line l1"></i><i class="line l2"></i><i class="line l3"></i><i class="line l4"></i></div>
  <div class="pane tray"><span class="arrow"></span><span class="ready"></span><span class="bar"><i></i></span></div>
</div>
</body>
</html>
