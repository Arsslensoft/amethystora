<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
/* An authenticator code: two halves of a code, the time left running down, and a new code when it runs out */
.art { --loop: 3.4s; --poster: 0.4; }
@keyframes left { 0% { width: 110px; background: #b37df9; } 70% { background: #b37df9; } 76% { background: #e8c06a; } 86% { width: 0; background: #e8c06a; } 87% { width: 110px; background: #b37df9; } 100% { width: 110px; background: #b37df9; } }
@keyframes old { 0%, 82% { opacity: 1; transform: translateY(0); } 88%, 100% { opacity: 0; transform: translateY(-6px); } }
@keyframes new { 0%, 84% { opacity: 0; transform: translateY(6px); } 92%, 100% { opacity: 1; transform: translateY(0); } }
@keyframes oldfade { 0%, 8% { opacity: 0; } 14%, 100% { opacity: 1; } }
@keyframes next { 0%, 64% { opacity: 0; } 72%, 84% { opacity: 1; } 90%, 100% { opacity: 0; } }
.card { left: 14px; top: 18px; width: 122px; height: 76px; }
.code { position: absolute; left: 10px; top: 14px; display: flex; gap: 4px; }
.code i { width: 13px; height: 22px; border-radius: 3px; background: #efe4ff; }
.code i.gap { width: 6px; background: none; }
.a { animation-name: old; }
.b { animation-name: new; }
.bar { position: absolute; left: 6px; top: 58px; height: 5px; border-radius: 3px; animation-name: left; animation-timing-function: linear; }
.track { position: absolute; left: 6px; top: 58px; width: 110px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); }
.next { position: absolute; left: 10px; top: 42px; display: flex; gap: 3px; animation-name: next; }
.next i { width: 6px; height: 7px; border-radius: 2px; background: rgba(220, 188, 255, 0.55); }
.next i.gap { width: 3px; background: none; }
</style>
</head>
<body>
<div class="art">
  <div class="pane card">
    <div class="code a"><i></i><i style="height: 22px"></i><i></i><i class="gap"></i><i></i><i></i><i></i></div>
    <div class="code b"><i></i><i></i><i></i><i class="gap"></i><i></i><i></i><i></i></div>
    <div class="next"><i></i><i></i><i></i><i class="gap"></i><i></i><i></i><i></i></div>
    <i class="track"></i><i class="bar"></i>
  </div>
</div>
</body>
</html>
