# Amethystora's kitty. kitty reads this first and your own ~/.config/kitty/kitty.conf over it, so a
# line of yours wins and the rest stays as the image has it. The colours are the theme's: they are
# rendered into ~/.config/amethystora/current/theme by amethystora-theme (themed/kitty-theme.conf.tpl).
# JetBrains Mono, unless the theme says another: its kitty-theme.conf (mono.theme, rendered) is read after this line
font_family JetBrains Mono
include ~/.config/amethystora/current/theme/kitty-theme.conf

# The prompt's arrows and icons are Nerd Fonts symbols, which kitty carries itself
font_size 11.0

# Like Ptyxis: 100 by 30 to start with, and not the size of the last window
remember_window_size no
initial_window_width 100c
initial_window_height 30c
window_padding_width 8
scrollback_lines 10000

# The window keeps its title bar: GNOME draws no decorations of its own for it, so one without
# leaves a window with no close button
hide_window_decorations no
confirm_os_window_close -1

# The same tab bar shape as the prompt
tab_bar_style powerline
tab_powerline_style angled
# A tab whose window rang the bell or printed something while it was behind carries a mark until it is shown
tab_title_template " {index}: {bell_symbol}{activity_symbol}{title} "
tab_activity_symbol "● "
active_tab_font_style bold

shell_integration enabled
allow_hyperlinks yes
# A link says where it goes before it is clicked, so that its text cannot hide another address
show_hyperlink_targets always
copy_on_select no
# A copy leaves out the spaces a program drew only to fill its lines
strip_trailing_spaces smart
enable_audio_bell no
window_alert_on_bell yes

# A command that ran ten seconds or more and ends while its window is not in front says so in a notification, which
# brings the window forward when clicked (`ame desktop command-done` turns it off)
notify_on_cmd_finish unfocused 10.0 notify

# Nothing is asked of the network, and nothing may drive the terminal from a program
update_check_interval 0
allow_remote_control no

# Ptyxis's keys for the tabs, beside kitty's own
map ctrl+page_up previous_tab
map ctrl+page_down next_tab
map ctrl+shift+w close_tab

# A new window, tab or split starts in the folder of the one in front, as Ptyxis's do. Ctrl+Shift+Return splits the
# window in front along its longer side and Ctrl+Shift+L shows one window at a time and back; the windows behind are
# drawn a little dimmer, so that the one taking the keys stands out
enabled_layouts splits,stack
map kitty_mod+enter launch --cwd=current --location=split
map kitty_mod+t new_tab_with_cwd
map kitty_mod+n new_os_window_with_cwd
inactive_text_alpha 0.8

# IBus takes Ctrl+Shift+U before kitty sees it (a character by its code, as in every app), so kitty's own picker of a
# character by its name is Ctrl+Shift+I
map kitty_mod+i kitten unicode_input

# The keypad's / is a key of its own to kitty, so Ctrl+Shift+/ searches what scrolled past from either
map kitty_mod+kp_divide search_scrollback

# The cursor leaves a short trail when it jumps, so that the eye follows it (`cursor_trail 0` in your own file stops it)
cursor_trail 3
cursor_trail_decay 0.1 0.3

# What `ame desktop` commands set for this account (only they write it; user-setup makes it for every account), read
# last so that it wins over the lines above; your own kitty.conf still wins over it
include ~/.config/amethystora/kitty.conf
