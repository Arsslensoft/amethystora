# The plugin system's store (plans/done/PLAN-plugins.md, Integrity): root's, and written only by amethystora-plugin-root. The folders
# an account's plugins are kept in are made by that helper; quarantine holds what waits for a person and is cleared at boot
d /var/lib/amethystora/plugins 0755 root root -
d /var/lib/amethystora/plugins/store 0755 root root -
d /var/lib/amethystora/plugins/accounts 0755 root root -
D /var/lib/amethystora/plugins/quarantine 0700 root root -
