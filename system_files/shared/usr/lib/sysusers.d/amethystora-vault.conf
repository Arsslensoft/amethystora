# The user Amethystora Vault's service runs as: it holds the keys, and no account can read its files or its memory. Its number
# is fixed at the one the first images gave it: a slot sealed by the TPM is bound to it, and a new number opens none of them
u amethystora-vault 956 "Amethystora Vault" /var/lib/amethystora/vault -
