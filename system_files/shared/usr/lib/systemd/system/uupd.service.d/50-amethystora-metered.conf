# Saving data (amethystora-metered): on a connection that counts data, the automatic update waits for one that does
# not, at most a week. uupd-manual.service, which Update now starts, has no such condition: it is Update anyway.
[Service]
ExecCondition=/usr/libexec/amethystora-metered wait system
ExecStartPost=/usr/libexec/amethystora-metered done system
