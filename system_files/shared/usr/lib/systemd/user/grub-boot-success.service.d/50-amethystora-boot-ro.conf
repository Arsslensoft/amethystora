# GRUB's "this boot succeeded" flag lives in /boot/grub2/grubenv, which ostree mounts read-only on Fedora 45:
# grub2-set-bootflag then fails ("Creating tmpfile failed: Read-only file system") and leaves a failed unit at every
# login. Skipped while /boot cannot be written; run as Fedora ships it where it can.
[Unit]
ConditionPathIsReadWrite=/boot
