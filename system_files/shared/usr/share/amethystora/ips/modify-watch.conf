# Network protection: added to modify.conf unless NETWORK is block, so that only block cuts anything off. A rule a source ships
# with the action drop or reject (a mistaken or hostile one would take the machine off the network, and Suricata runs inline in
# watch too) alerts instead. The format is a matcher, a regular expression and its replacement, each quoted.
"re:^(drop|reject|rejectsrc|rejectdst|rejectboth)\s" "^\w+\s" "alert "
