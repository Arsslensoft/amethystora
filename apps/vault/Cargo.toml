# The Vault's window, one of the Amethystora apps. It holds a secret only while showing it: the keys are the service's.
[package]
name = "amethystora-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
amethystora-ui.workspace = true
amethystora-vault-core.workspace = true
amethystora-vault-client.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
base64.workspace = true
zeroize.workspace = true
# A QR code is read here, never in the service, since a picture from anywhere is untrusted
rqrr = { version = "0.11", default-features = false }
